name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      appimage_stable_update_preview:
        description: "Test stable AppImage update metadata and zsync on a branch without publishing"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  CF_COMPASS_APPIMAGE_STABLE_UPDATE_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.appimage_stable_update_preview && '1' || '0' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Run focused tests
        run: |
          pnpm exec node --test scripts/test-appimage-release.mjs
          pnpm exec node --test scripts/test-appimage-apparmor.mjs scripts/test-release-assets.mjs
          pnpm test:custom-training
          pnpm test:study-timer
          pnpm test:app-update
          pnpm exec node scripts/test-template-summary-format.mjs
          pnpm exec node scripts/test-carrot.mjs
          pnpm exec node scripts/test-analytics.mjs
          pnpm exec node scripts/test-ai-service.cjs
          pnpm exec node scripts/test-ai-review-storage.cjs
          pnpm exec node scripts/test-contest-recommendations.cjs
          pnpm exec node scripts/test-codeforces-source-service.cjs
          pnpm exec node scripts/test-codeforces-standings.cjs
          pnpm exec node scripts/test-study-plan-service.cjs
          pnpm exec node scripts/test-material-library.cjs
          pnpm exec node scripts/test-performance.mjs
          pnpm exec node scripts/test-training-profile.mjs
          pnpm exec node --test scripts/test-virtual-rating.cjs
          pnpm exec node --test scripts/test-combined-rating.cjs scripts/test-combined-reference.cjs scripts/test-combined-service.cjs
          pnpm exec node --test scripts/test-contest-sessions.cjs scripts/test-virtual-reference.cjs scripts/test-virtual-score.cjs scripts/test-workbench-layout.mjs scripts/test-frame-queue.mjs
      - name: Build renderer
        run: pnpm verify

  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package-test]'))
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Windows-x64
            os: windows-latest
            command: pnpm exec electron-builder --win nsis portable --x64 --publish never
          - target: Linux-x64
            os: ubuntu-24.04
            command: pnpm exec electron-builder --linux AppImage deb --x64 --publish never
          - target: macOS-x64
            os: macos-15-intel
            runner_arch: x86_64
            command: pnpm exec electron-builder --mac dmg --x64 --publish never
          - target: macOS-arm64
            os: macos-latest
            runner_arch: arm64
            command: pnpm exec electron-builder --mac dmg --arm64 --publish never
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build renderer
        run: pnpm build
      - name: Package ${{ matrix.target }}
        run: ${{ matrix.command }}
      - name: Install AppImage build and launch tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsync fuse3 xvfb xauth desktop-file-utils appstream
      - name: Repack AppImage with static runtime and update information
        id: repack
        if: runner.os == 'Linux'
        run: bash scripts/repack-appimage.sh release
      - name: Verify Windows layout and packaged launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pnpm exec node scripts/verify-release-assets.mjs release --windows-only
          if ($LASTEXITCODE -ne 0) { throw 'Windows updater metadata validation failed.' }
          $executable = Get-ChildItem release/win-unpacked -File -Filter '*.exe' | Select-Object -First 1
          if (-not $executable) {
            throw 'No unpacked Windows executable was found.'
          }
          $env:CF_COMPASS_PLAYWRIGHT = 'playwright-core'
          $env:CF_COMPASS_QA_EXECUTABLE = $executable.FullName
          $checks = @('qa-material-quarantine.cjs', 'qa-issue-13-layout.cjs', 'qa-template-summary-persistence.cjs', 'qa-study-plan.cjs', 'qa-electron.cjs', 'qa-issue-25-virtual.cjs', 'qa-workbench-layout.cjs', 'benchmark-interactions.cjs', 'qa-appearance-controls.cjs', 'qa-public-standings.cjs', 'qa-titlebar.cjs', 'qa-virtual-score.cjs')
          foreach ($check in $checks) {
            pnpm exec node "scripts/$check"
            if ($LASTEXITCODE -ne 0) { throw "Packaged regression failed: $check (exit $LASTEXITCODE)" }
          }
          foreach ($check in @('qa-dual-rating.cjs', 'qa-issue-31-training.cjs')) {
            pnpm exec node "scripts/$check"
            if ($LASTEXITCODE -ne 0) { throw "Packaged regression failed: $check (exit $LASTEXITCODE)" }
          }
          foreach ($check in @('qa-custom-training.cjs', 'qa-app-update.cjs', 'qa-study-timer.cjs')) {
            pnpm exec node "scripts/$check"
            if ($LASTEXITCODE -ne 0) { throw "Packaged regression failed: $check (exit $LASTEXITCODE)" }
          }
          pnpm qa:app-update:main
          if ($LASTEXITCODE -ne 0) { throw 'Updater/training main IPC regression failed.' }
          pnpm exec node scripts/qa-issue-27.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged regression failed: qa-issue-27.cjs' }
          pnpm exec node scripts/qa-combined-rating.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged regression failed: qa-combined-rating.cjs' }
          foreach ($check in @('qa-unified-replay.cjs', 'qa-combined-unsettled.cjs')) {
            pnpm exec node "scripts/$check"
            if ($LASTEXITCODE -ne 0) { throw "Packaged regression failed: $check (exit $LASTEXITCODE)" }
          }
      - name: Verify installed Debian package with sandbox enabled
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find "$PWD/release" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          sudo apt-get install -y "$deb"
          executable="$(readlink -f /usr/bin/cf-compass)"
          test -f "$executable" && test -x "$executable"
          export CF_COMPASS_QA_EXECUTABLE="$executable"
          export CF_COMPASS_QA_OUTPUT="$PWD/.qa-output/debian-installed"
          export CF_COMPASS_QA_APPARMOR_PROFILE=cf-compass
          xvfb-run -a -s '-screen 0 1920x1080x24' pnpm exec node scripts/qa-first-launch.cjs
      - name: Authorize only the fixed AppImage path on restricted Ubuntu 24.04
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          command -v unshare
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          if unshare -Ur true; then echo 'Expected the unrelated namespace probe to remain restricted.' >&2; exit 1; fi
          appimage="$(find "$PWD/release" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          sudo install -d -o root -g root -m 755 /opt/cf-compass
          sudo install -o root -g root -m 755 "$appimage" /opt/cf-compass/CF-Compass.AppImage
          cmp "$appimage" /opt/cf-compass/CF-Compass.AppImage
          node scripts/appimage-apparmor.mjs /opt/cf-compass/CF-Compass.AppImage .qa-output/cf-compass-appimage.profile
          sudo apparmor_parser -r .qa-output/cf-compass-appimage.profile
      - name: Verify authorized AppImage offline first launch through FUSE and extraction
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage=/opt/cf-compass/CF-Compass.AppImage
          test -x "$appimage"
          qa_failed=0
          for mode in fuse extract; do
            if [[ "$mode" == fuse ]] && ! { test -c /dev/fuse && test -r /dev/fuse && test -w /dev/fuse; }; then
              echo 'FUSE is unavailable on this runner; mounted-launch verification cannot pass.' >&2
              qa_failed=1
              continue
            fi
            # A temporary network namespace blocks external traffic for every
            # application process; loopback remains available to Playwright.
            if ! sudo unshare --net -- bash -c '
              set -euo pipefail
              ip link set lo up
              extra_env=()
              if [[ "$5" == extract ]]; then extra_env+=(APPIMAGE_EXTRACT_AND_RUN=1); fi
              exec runuser -u "$1" -- env -u APPIMAGE_EXTRACT_AND_RUN \
                PATH="$2" CF_COMPASS_QA_EXECUTABLE="$3" CF_COMPASS_QA_OUTPUT="$4" \
                CF_COMPASS_QA_LAUNCH_MODE="$5" CF_COMPASS_QA_NETWORK_ISOLATED=1 \
                CF_COMPASS_QA_APPARMOR_PROFILE=cf-compass-appimage \
                "${extra_env[@]}" xvfb-run -a -s "-screen 0 1920x1080x24" "$6" scripts/qa-first-launch.cjs
            ' _ "$(id -un)" "$PATH" "$appimage" "$PWD/.qa-output/appimage-$mode" "$mode" "$(command -v node)"; then
              echo "AppImage $mode first-launch check failed; continuing to collect the other mode." >&2
              qa_failed=1
            fi
          done
          exit "$qa_failed"
      - name: Unload scoped policy and verify global restrictions remain enabled
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          command -v unshare
          profile=.qa-output/cf-compass-appimage.profile
          if [[ -f "$profile" ]]; then sudo apparmor_parser -R "$profile"; fi
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          if unshare -Ur true; then echo 'Unrelated programs unexpectedly gained namespace permission.' >&2; exit 1; fi
      - name: Upload AppImage first-launch evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: AppImage-first-launch-ubuntu-current
          path: |
            .qa-output/appimage-*
            .qa-output/debian-installed
            .qa-output/cf-compass-appimage.profile
          include-hidden-files: true
          if-no-files-found: warn
      - name: Verify macOS application signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          actual_arch="$(uname -m)"
          if [ "$actual_arch" != "${{ matrix.runner_arch }}" ]; then
            echo "Expected a native ${{ matrix.runner_arch }} runner, got $actual_arch."
            exit 1
          fi
          app="$(find release -type d -name '*.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "No packaged macOS application was found."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
          echo "$signature"
          echo "$signature" | grep -q 'Signature=adhoc'
      - name: Smoke test packaged macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="$(find release -type d -name '*.app' -print -quit)"
          executable="$app/Contents/MacOS/CF Compass"
          log="$(mktemp)"
          ELECTRON_ENABLE_LOGGING=1 "$executable" --disable-gpu >"$log" 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$log"
            wait "$pid"
            exit 1
          fi
          kill "$pid"
          wait "$pid" || true
          cat "$log"
      - name: Upload ${{ matrix.target }} package
        if: success() || (runner.os == 'Linux' && steps.repack.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: CF-Compass-${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/*.AppImage
            release/*.zsync
            release/*.deb
            release/*.dmg

  verify-appimage-ubuntu-22:
    if: always() && !cancelled() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package-test]')))
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install test dependencies
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y fuse3 xvfb xauth
      - uses: actions/download-artifact@v8
        with:
          name: CF-Compass-Linux-x64
          path: release
      - name: Verify final AppImage metadata on Ubuntu 22.04
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find "$PWD/release" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x "$appimage"
          node scripts/verify-appimage.mjs release --update-channel=auto
      - name: Verify offline first launch through FUSE and extraction on Ubuntu 22.04
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find "$PWD/release" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          qa_failed=0
          for mode in fuse extract; do
            if [[ "$mode" == fuse ]] && ! { test -c /dev/fuse && test -r /dev/fuse && test -w /dev/fuse; }; then
              echo 'FUSE is unavailable on this runner; mounted-launch verification cannot pass.' >&2
              qa_failed=1
              continue
            fi
            if ! sudo unshare --net -- bash -c '
              set -euo pipefail
              ip link set lo up
              extra_env=()
              if [[ "$5" == extract ]]; then extra_env+=(APPIMAGE_EXTRACT_AND_RUN=1); fi
              exec runuser -u "$1" -- env -u APPIMAGE_EXTRACT_AND_RUN \
                PATH="$2" CF_COMPASS_QA_EXECUTABLE="$3" CF_COMPASS_QA_OUTPUT="$4" \
                CF_COMPASS_QA_LAUNCH_MODE="$5" CF_COMPASS_QA_NETWORK_ISOLATED=1 \
                "${extra_env[@]}" xvfb-run -a -s "-screen 0 1920x1080x24" "$6" scripts/qa-first-launch.cjs
            ' _ "$(id -un)" "$PATH" "$appimage" "$PWD/.qa-output/appimage-$mode" "$mode" "$(command -v node)"; then
              echo "AppImage $mode first-launch check failed; continuing to collect the other mode." >&2
              qa_failed=1
            fi
          done
          exit "$qa_failed"
      - name: Upload Ubuntu 22.04 first-launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AppImage-first-launch-ubuntu-22.04
          path: .qa-output/appimage-*
          include-hidden-files: true
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.appimage_stable_update_preview)
    needs: [package, verify-appimage-ubuntu-22]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install verification dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: CF-Compass-*
          path: release
          merge-multiple: true
      - name: Verify exact public asset inventory
        run: node scripts/verify-release-assets.mjs release --require-tag-match
      - name: Generate private verification manifest
        run: node scripts/generate-checksums.mjs release --manifest=release-verification-manifest/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release/*.exe release/*.exe.blockmap release/*.AppImage release/*.zsync release/*.deb release/*.dmg)
          if [[ -f release/latest.yml ]]; then assets+=(release/latest.yml); fi
          node scripts/verify-release-assets.mjs release
          notes="docs/releases/$GITHUB_REF_NAME.md"
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-alpha.*|*-beta.*|*-rc.*) prerelease="--prerelease" ;;
          esac
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --draft $prerelease --notes-file "$notes" --title "CF Compass $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --draft $prerelease --generate-notes --title "CF Compass $GITHUB_REF_NAME"
          fi
      - name: Download and verify published packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-verification
          gh release download "$GITHUB_REF_NAME" --dir release-verification
          node scripts/verify-release-assets.mjs release-verification
          cd release-verification
          sha256sum -c ../release-verification-manifest/SHA256SUMS.txt
  verify-published-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install upgrade verification dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: CF-Compass-Windows-x64
          path: expected-windows
      - name: Download and verify published Windows packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force release-verification | Out-Null
          gh release download $env:GITHUB_REF_NAME --dir release-verification --pattern '*Windows-x64-Setup.exe' --pattern '*Windows-x64-portable.exe'
          $windowsPackages = @(
            @{ Pattern = 'Windows-x64-Setup\.exe$'; Label = 'installer' },
            @{ Pattern = 'Windows-x64-portable\.exe$'; Label = 'portable' }
          )
          foreach ($package in $windowsPackages) {
            $expected = Get-ChildItem expected-windows -File | Where-Object { $_.Name -match $package.Pattern } | Select-Object -First 1
            $published = Get-ChildItem release-verification -File | Where-Object { $_.Name -match $package.Pattern } | Select-Object -First 1
            if (-not $expected -or -not $published -or $expected.Name -ne $published.Name) {
              throw "The Windows $($package.Label) package is missing or named differently after publication."
            }
            $expectedHash = (Get-FileHash -LiteralPath $expected.FullName -Algorithm SHA256).Hash
            $publishedHash = (Get-FileHash -LiteralPath $published.FullName -Algorithm SHA256).Hash
            if ($expectedHash -ne $publishedHash) {
              throw "Windows $($package.Label) package differs from the verified build artifact."
            }
          }
          $installer = Get-ChildItem release-verification -File -Filter '*Windows-x64-Setup.exe' | Select-Object -First 1
          $portable = Get-ChildItem release-verification -File -Filter '*Windows-x64-portable.exe' | Select-Object -First 1
          & ./scripts/qa-windows-installer.ps1 -Installer $installer.FullName
          & ./scripts/qa-windows-portable.ps1 -Executable $portable.FullName
      - name: Verify previous stable installer upgrade in the isolated runner
        if: ${{ !contains(github.ref_name, '-') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previousTag = gh release view --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0 -or $previousTag -notmatch '^v\d+\.\d+\.\d+$') { throw 'Cannot resolve the previous stable release.' }
          $previousVersion = $previousTag.TrimStart('v')
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ([Version]$previousVersion -ge [Version]$version) { throw 'The previous stable release must be older than the candidate.' }
          New-Item -ItemType Directory -Force release-upgrade | Out-Null
          gh release download $previousTag --dir release-upgrade --pattern '*Windows-x64-Setup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download the previous stable Windows installer.' }
          $previous = Get-ChildItem release-upgrade -File -Filter '*Windows-x64-Setup.exe' | Select-Object -First 1
          $candidate = Get-ChildItem release-verification -File -Filter '*Windows-x64-Setup.exe' | Select-Object -First 1
          $previousRelease = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$previousTag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the previous stable installer digest.' }
          $previousAsset = $previousRelease.assets | Where-Object { $_.name -eq $previous.Name } | Select-Object -First 1
          if ($previousAsset.digest -notmatch '^sha256:[a-f0-9]{64}$' -or "sha256:$((Get-FileHash -LiteralPath $previous.FullName -Algorithm SHA256).Hash)" -ne $previousAsset.digest) {
            throw 'The previous stable installer differs from its official GitHub digest.'
          }
          & ./scripts/qa-windows-upgrade.ps1 -PreviousInstaller $previous.FullName -Installer $candidate.FullName -ExpectedPreviousVersion $previousVersion -ExpectedVersion $version
          if ($LASTEXITCODE -ne 0) { throw 'The previous-stable installer upgrade verification failed.' }
      - name: Publish verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-alpha.*|*-beta.*|*-rc.*) gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease ;;
            *) gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest ;;
          esac
      - name: Close issues verified by this release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issues="docs/releases/$GITHUB_REF_NAME.issues"
          [ -f "$issues" ] || exit 0
          while IFS= read -r issue; do
            case "$issue" in
              ''|'#'*) continue ;;
            esac
            release_url="https://github.com/${{ github.repository }}/releases/tag/$GITHUB_REF_NAME"
            comment="docs/releases/$GITHUB_REF_NAME.issue-$issue.md"
            if [ -f "$comment" ]; then
              gh issue comment "$issue" --body-file "$comment"
            else
              gh issue comment "$issue" --body "已在 [$GITHUB_REF_NAME]($release_url) 中修复。跨平台构建、包校验和发布后的 Windows 安装/冷启动验证通过。感谢反馈！"
            fi
            gh issue close "$issue" --reason completed
          done < "$issues"
