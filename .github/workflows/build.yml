name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Run focused tests
        run: |
          pnpm exec node scripts/test-template-summary-format.mjs
          pnpm exec node scripts/test-carrot.mjs
      - name: Build renderer
        run: pnpm verify
      - name: Build Windows portable app
        run: pnpm desktop:build
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $artifact = Get-ChildItem -LiteralPath release -Filter "CF-Compass-*-portable.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $artifact) { throw "Windows portable artifact was not produced." }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName).Hash.ToLowerInvariant()
          "$hash  $($artifact.Name)" | Set-Content -LiteralPath "$($artifact.FullName).sha256" -Encoding ascii
      - name: Upload verified Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CF-Compass-Windows-x64
          path: |
            release/CF-Compass-*-portable.exe
            release/CF-Compass-*-portable.exe.sha256
          if-no-files-found: error
